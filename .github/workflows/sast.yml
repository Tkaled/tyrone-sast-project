name: SAST - Semgrep

on:
  push:
  pull_request:

jobs:
  semgrep:
    name: Analisis SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
